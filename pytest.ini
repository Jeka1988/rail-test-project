[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --browser chromium
    --tracing=retain-on-failure
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure
markers =
    e2e: end-to-end account lifecycle scenarios
